[project]
name = "op-workers"
version = "0.1.0"
description = "Worker Python di openpolitica: connettori, pipeline, job di catalogo e rilascio"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.27",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
    "trafilatura>=2.3.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["op_workers"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S310"]  # urlopen su indirizzi locali fissi

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["contratto: interroga le fonti vere, solo in GitHub Actions"]
addopts = "-m 'not contratto'"
