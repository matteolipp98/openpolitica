[project]
name = "op-workers"
version = "0.1.0"
description = "Worker Python di openpolitica: connettori, pipeline, job di catalogo e rilascio"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["op_workers"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
