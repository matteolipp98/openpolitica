# Verifica e prepara i servizi esterni: Supabase (con la chiave segreta) e Render (job di import).
name: Infrastruttura

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**", "task/**"]
    paths:
      - .github/workflows/infrastruttura.yml
      - .github/scripts/render_env.py

jobs:
  controllo-secret:
    name: Quali secret arrivano ai workflow
    runs-on: ubuntu-latest
    environment: dev   # i secret sono nell'environment dev
    steps:
      - name: Presenza (mai i valori)
        run: |
          riga() { echo "| $1 | $( [ "$2" = true ] && echo sì || echo no ) |"; }
          {
          echo "| Nome | Presente nell'environment dev |"
          echo "|---|---|"
          riga NEXT_PUBLIC_SUPABASE_URL "${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' }}"
          riga NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY "${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY != '' }}"
          riga SUPABASE_SECRET_KEY "${{ secrets.SUPABASE_SECRET_KEY != '' }}"
          riga SESSION_POOLER "${{ secrets.SESSION_POOLER != '' }}"
          riga VERCEL_TOKEN "${{ secrets.VERCEL_TOKEN != '' }}"
          riga RENDER_API_KEY "${{ secrets.RENDER_API_KEY != '' }}"
          riga GEMINI_API_KEY "${{ secrets.GEMINI_API_KEY != '' }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  supabase:
    runs-on: ubuntu-latest
    environment: dev   # i secret sono nell'environment dev
    env:
      URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      CHIAVE: ${{ secrets.SUPABASE_SECRET_KEY }}
      DB: ${{ secrets.SESSION_POOLER }}
    steps:
      - name: Connessione con la chiave segreta
        run: |
          test -n "$URL" || { echo "Manca NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          code=$(curl -s -o /tmp/r -w '%{http_code}' "$URL/storage/v1/bucket" -H "apikey: $CHIAVE" -H "Authorization: Bearer $CHIAVE")
          echo "Storage: HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$code" = 200 || { cat /tmp/r; exit 1; }
      - name: Contenitore pubblico dei rilasci (piano §3.9)
        run: |
          code=$(curl -s -o /tmp/r -w '%{http_code}' -X POST "$URL/storage/v1/bucket" \
            -H "apikey: $CHIAVE" -H "Authorization: Bearer $CHIAVE" -H "Content-Type: application/json" \
            -d '{"id":"rilasci","name":"rilasci","public":true}')
          echo "Creazione bucket rilasci: HTTP $code $(cat /tmp/r)" | tee -a "$GITHUB_STEP_SUMMARY"
          # 200 = creato; 400/409 = esiste già
          case "$code" in 200|400|409) ;; *) exit 1 ;; esac
      - name: Accesso diretto al database (serve per le migrazioni)
        run: |
          if [ -z "$DB" ]; then
            echo "Manca SESSION_POOLER: senza non si possono creare le tabelle né importare i voti." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "SESSION_POOLER presente." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  render:
    runs-on: ubuntu-latest
    environment: dev   # i secret sono nell'environment dev
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      DB: ${{ secrets.SESSION_POOLER }}
    steps:
      - uses: actions/checkout@v7
      - name: Collega il servizio Render al database
        run: python3 .github/scripts/render_env.py
