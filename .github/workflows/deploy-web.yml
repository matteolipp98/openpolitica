# Deploy del sito su Vercel (ADR 0017). Build fatto qui, poi caricato già pronto (--prebuilt).
# Si pubblica solo da main. Vercel non costruisce da solo a ogni push (vercel.json, git.deploymentEnabled).
name: Deploy sito

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/**
      - content/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-web.yml

concurrency: { group: deploy-web, cancel-in-progress: false }

jobs:
  vercel:
    runs-on: ubuntu-latest
    environment: dev   # i secret sono nell'environment dev
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}   # pubblici: link "scarica i dati" e segnalazioni
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:check
      # Dati del sito (piano §3.9): l'ultimo pacchetto pubblicato dal workflow Rilascio. Senza pacchetto il sito
      # usa i dati di esempio e lo dice in ogni pagina; con un pacchetto parziale dice fin dove arrivano i voti.
      - name: Dati del sito
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        shell: bash
        run: |
          base="${SUPABASE_URL%/}/storage/v1/object/public/rilasci"
          if ! curl -sfL "$base/corrente.json" -o /tmp/corrente.json; then
            echo "Nessun pacchetto pubblicato: il sito usa i dati di esempio." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          v=$(python3 -c "import json;print(json.load(open('/tmp/corrente.json'))['versione'])")
          mkdir -p apps/web/.data
          curl -sfL "$base/$v/manifest.json" -o apps/web/.data/manifest.json
          for f in $(python3 -c "import json;print(' '.join(json.load(open('apps/web/.data/manifest.json'))['file']))"); do
            curl -sfL "$base/$v/$f" -o "apps/web/.data/$f"
          done
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          d = pathlib.Path("apps/web/.data"); m = json.loads((d / "manifest.json").read_text())
          for f, h in m["file"].items():
              if "sha256:" + hashlib.sha256((d / f).read_bytes()).hexdigest() != h:
                  sys.exit(f"Impronta sbagliata per {f}: il pacchetto non si usa")
          PY
          pnpm --filter @op/schema valida-pacchetto "$PWD/apps/web/.data"
          echo "Il sito usa i dati veri: pacchetto $v. Le parti che mancano lo dicono in pagina." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Collega o crea il progetto Vercel
        working-directory: apps/web
        run: npx --yes vercel@latest link --yes --project openpolitica --token "$VERCEL_TOKEN"
      - name: Impostazioni del progetto
        working-directory: apps/web
        run: npx --yes vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
      - name: Build
        working-directory: apps/web
        run: npx --yes vercel@latest build --prod --token "$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        working-directory: apps/web
        # Si carica da una cartella senza storia git: Vercel blocca i deploy se non riconosce
        # l'email dell'autore del commit (per esempio quella noreply di GitHub dei merge).
        run: |
          dir=$(mktemp -d)
          mkdir -p "$dir/.vercel"
          cp -r .vercel/output .vercel/project.json "$dir/.vercel/"
          cd "$dir"
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Sito pubblicato: $url" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Controllo delle pagine
        # L'indirizzo del singolo deploy è protetto da login Vercel (302); quello di produzione dev'essere pubblico.
        run: |
          base=https://openpolitica.vercel.app
          partito=$(curl -s "$base/" | grep -o 'href="/partiti/[a-z0-9-]*"' | head -1 | cut -d'"' -f2)
          for p in / /come-funziona /domande "$partito"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base$p")
            echo "$base$p -> $code" | tee -a "$GITHUB_STEP_SUMMARY"
            test "$code" = 200
          done
          curl -s "$base/" | grep -o "<h1>[^<]*</h1>" | tee -a "$GITHUB_STEP_SUMMARY"
