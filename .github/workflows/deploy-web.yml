# Deploy del sito su Vercel (ADR 0017). Build fatto qui, poi caricato già pronto (--prebuilt).
# Per ora va in produzione anche da questo branch, finché non c'è un main con il codice.
name: Deploy sito

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - apps/web/**
      - packages/**
      - content/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-web.yml

concurrency: { group: deploy-web, cancel-in-progress: true }

jobs:
  vercel:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || vars.VERCEL_TOKEN }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:check
      - name: Collega o crea il progetto Vercel
        working-directory: apps/web
        run: npx --yes vercel@latest link --yes --project openpolitica --token "$VERCEL_TOKEN"
      - name: Impostazioni del progetto
        working-directory: apps/web
        run: npx --yes vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
      - name: Build
        working-directory: apps/web
        run: npx --yes vercel@latest build --prod --token "$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        working-directory: apps/web
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Sito pubblicato: $url" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Controllo delle pagine
        run: |
          for p in / /come-funziona /domande /partiti/lega /persone/elly-schlein; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.deploy.outputs.url }}$p")
            echo "$p -> $code" | tee -a "$GITHUB_STEP_SUMMARY"
          done
