# Pacchetto di rilascio del sito (piano §3.9): dal database e da content/ a file JSON con una versione,
# controllati, pubblicati su Supabase Storage (rilasci/<versione>/) e poi il sito si ricostruisce.
name: Rilascio

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Database]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - content/catalogo/**
      - workers/op_workers/rilascio/**
      - .github/workflows/rilascio.yml

concurrency: { group: rilascio, cancel-in-progress: false }

jobs:
  rilascio:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write   # per far ripartire il deploy del sito
    env:
      DATABASE_URL: ${{ secrets.SESSION_POOLER }}
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Costruisci il pacchetto
        working-directory: workers
        run: |
          uv sync --frozen
          uv run python -m op_workers.rilascio.crea --uscita ../rilascio | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Controlla il pacchetto
        run: pnpm --filter @op/schema valida-pacchetto "$PWD/rilascio" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pubblica
        working-directory: workers
        run: uv run python -m op_workers.rilascio.pubblica ../rilascio | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: rilascio, path: rilascio/, retention-days: 30 }
      - name: Ricostruisci il sito
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run deploy-web.yml --ref main --repo "${{ github.repository }}"
