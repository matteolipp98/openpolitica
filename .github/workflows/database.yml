# Database su Supabase: applica le migrazioni, sincronizza l'anagrafica da content/ e importa i voti.
# L'import è idempotente e riparte dall'ultimo giorno importato: rilanciarlo non duplica nulla.
name: Database

on:
  workflow_dispatch:
    inputs:
      importa:
        description: "Importa i voti"
        type: choice
        options: [entrambi, camera, senato, nessuno]
        default: entrambi
  schedule:
    - cron: "41 */6 * * *"   # ogni 6 ore: riprende gli import interrotti dai limiti delle fonti
  push:
    branches: [main]   # un solo database: i branch di lavoro non devono scavalcare main nella coda
    paths:
      - supabase/migrations/**
      - content/partiti.yaml
      - content/gruppi.yaml
      - content/componenti-misto.yaml
      - content/perimetro.yaml
      - content/alias/**
      - workers/op_workers/connettori/**
      - workers/op_workers/comuni/**
      - workers/op_workers/anagrafica/**
      - .github/workflows/database.yml

concurrency: { group: database, cancel-in-progress: false }

jobs:
  migra:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.SESSION_POOLER }}
    defaults: { run: { working-directory: workers, shell: bash } }  # bash = pipefail: un errore fa fallire il job
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - name: Controllo della stringa di connessione
        run: |
          test -n "$DATABASE_URL" || { echo "Manca il secret SESSION_POOLER nell'environment dev"; exit 1; }
          case "$DATABASE_URL" in *YOUR-PASSWORD*) echo "Nella stringa c'è ancora [YOUR-PASSWORD]: va sostituita con la password"; exit 1;; esac
      - name: Migrazioni
        run: uv run python -m op_workers.comuni.migrazioni | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Anagrafica da content/
        run: uv run python -m op_workers.anagrafica.sincronizza | tee -a "$GITHUB_STEP_SUMMARY"
      # Partito di chi sta nel gruppo misto, dalle componenti politiche (issue #78). Le persone nuove le crea
      # l'import dei voti: quelle che mancano ancora si aggiungono al giro dopo.
      - name: Componenti del gruppo misto
        run: uv run python -m op_workers.anagrafica.componenti_misto | tee -a "$GITHUB_STEP_SUMMARY"

  importa:
    needs: migra
    if: github.event_name != 'workflow_dispatch' || inputs.importa != 'nessuno'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        ramo: [camera, senato]
    env:
      DATABASE_URL: ${{ secrets.SESSION_POOLER }}
    defaults: { run: { working-directory: workers, shell: bash } }  # bash = pipefail: un errore fa fallire il job
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch' || inputs.importa == 'entrambi' || inputs.importa == matrix.ramo
      - uses: astral-sh/setup-uv@v10.2.0
        if: github.event_name != 'workflow_dispatch' || inputs.importa == 'entrambi' || inputs.importa == matrix.ramo
      - name: Import ${{ matrix.ramo }}
        if: github.event_name != 'workflow_dispatch' || inputs.importa == 'entrambi' || inputs.importa == matrix.ramo
        run: |
          uv sync --frozen
          uv run python -m op_workers.connettori.importa_voti ${{ matrix.ramo }} | tail -5 | tee -a "$GITHUB_STEP_SUMMARY"

  # Andamento nel tempo dai voti (ADR 0040): due metriche senza modelli. Gira anche se un import si è
  # fermato per i limiti delle fonti: usa quello che c'è nel database.
  andamento:
    needs: importa
    if: always() && needs.importa.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.SESSION_POOLER }}
    defaults: { run: { working-directory: workers, shell: bash } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - name: Calcola "vota come il governo" e "il partito vota unito"
        run: uv run python -m op_workers.andamento.da_voti --uscita ../andamento/andamento.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with: { name: andamento, path: andamento/andamento.json, retention-days: 30 }
