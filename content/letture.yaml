# Frasi generate da regole fisse, uguali per tutti (ADR 0037). Linguaggio dell'ADR 0036.
versione: 1
frasiNumeri:
  - { se: "denominatore < 30", testo: "Ha detto pochi numeri controllabili, quindi su questo non possiamo dire molto." }
  - { se: "quota >= 0.15",     testo: "Sbaglia spesso i numeri: {n} volte su {d}." }
  - { se: "quota <= 0.06",     testo: "Quando dice un numero, di solito è giusto: sbagliato {n} volte su {d}." }
  - { altrimenti: true,        testo: "Sui numeri va così così: sbagliati {n} su {d}." }
letture:
  - metrica: numeri_sbagliati
    verso: max
    testo: "{soggetti} è quello che sbaglia più numeri."
    testoPiu: "{soggetti} sono quelli che sbagliano più numeri."
    sotto: "{n} numeri sbagliati su {d} che abbiamo potuto controllare."
  - metrica: non_controllabili
    verso: max
    testo: "{soggetti} è il più vago: parla senza dire niente di controllabile."
    testoPiu: "{soggetti} sono i più vaghi: parlano senza dire niente di controllabile."
    sotto: "{n} frasi su {d} non si possono controllare."
  - metrica: voti_contrari
    verso: max
    testo: "{soggetti} dice una cosa e poi in aula vota il contrario."
    testoPiu: "{soggetti} dicono una cosa e poi in aula votano il contrario."
    sotto: "È successo {n} volte su {d}."
  - metrica: promesse_non_mantenute
    aggregata: true
    testo: "Promesse rimaste solo sulla carta."
    sotto: "Su {d} promesse scritte nei programmi."
