# Chi seguiamo e perché (ADR 0002): un criterio pubblico, non una scelta redazionale.
versione: 1
aggiornato_il: 2026-10-07
legislatura: 19
criterio: >
  Seguiamo i partiti che hanno un gruppo parlamentare tutto loro alla Camera o al Senato
  nella legislatura in corso. Per ogni partito seguiamo chi lo guida (segretario, presidente
  o portavoce). Se il partito è un'alleanza con più guide, le seguiamo tutte.
  Seguiamo anche chi guida il governo.
